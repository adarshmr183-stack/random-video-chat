
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Video Chat</title>

    <style>
        #reportBtn {
    background: #ff9800;
    color: white;
}
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1b1b1b;
        }

        header h1 {
            margin: 0;
        }

        #status {
            text-align: center;
            padding: 15px;
            font-size: 18px;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        video {
            width: 100%;
            height: 400px;
            background: #222;
            border-radius: 12px;
            object-fit: cover;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #startBtn {
            background: #00c853;
            color: white;
        }

        #nextBtn {
            background: #2979ff;
            color: white;
        }

        #disconnectBtn {
            background: #d50000;
            color: white;
        }

        #muteBtn,
        #cameraBtn {
            background: #444;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            .videos {
                grid-template-columns: 1fr;
            }

            video {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Random Video Chat</h1>
    </header>

    <div id="status">
        Click Start to begin
    </div>

    <div class="videos">
        <div>
            <h3>You</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div>
            <h3>Stranger</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="controls">
        <button id="reportBtn">Report</button>
        <button id="startBtn">Start</button>
        <button id="nextBtn" disabled>Next</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
        <button id="muteBtn" disabled>Mute</button>
        <button id="cameraBtn" disabled>Camera Off</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>

</body>
</html>
